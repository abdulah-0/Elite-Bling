<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9efcc"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b8962c"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle Decorative Gold Borders -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.25"/>
  <rect x="52" y="52" width="1096" height="526" fill="none" stroke="#d4af37" stroke-width="0.75" stroke-opacity="0.15"/>

  <!-- Corner Accents -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#d4af37" stroke-width="3"/>
  <path d="M 1160 70 L 1160 40 L 1130 40" fill="none" stroke="#d4af37" stroke-width="3"/>
  <path d="M 40 560 L 40 590 L 70 590" fill="none" stroke="#d4af37" stroke-width="3"/>
  <path d="M 1160 560 L 1160 590 L 1130 590" fill="none" stroke="#d4af37" stroke-width="3"/>

  <!-- Diamond / Jewelry Icon Silhouette -->
  <g transform="translate(600, 160) scale(1.3)">
    <polygon points="0,-35 30,-5 0,35 -30,-5" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <polygon points="0,-25 20,-5 0,25 -20,-5" fill="none" stroke="#d4af37" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="0" cy="-5" r="4" fill="url(#gold)"/>
  </g>

  <!-- Brand Name -->
  <text x="600" y="295" font-family="'Playfair Display', serif, Georgia" font-size="76" font-weight="bold" fill="url(#gold)" text-anchor="middle" letter-spacing="4">
    ELLITE BLING
  </text>

  <!-- Divider Line -->
  <rect x="450" y="325" width="300" height="2" fill="url(#goldBorder)"/>

  <!-- Tagline / Subtitle -->
  <text x="600" y="380" font-family="'Inter', sans-serif, Arial" font-size="28" font-weight="300" fill="#FAF7F2" text-anchor="middle" letter-spacing="6">
    LUXURY ARTIFICIAL JEWELRY
  </text>

  <text x="600" y="425" font-family="'Inter', sans-serif, Arial" font-size="22" font-weight="400" fill="#d4af37" text-anchor="middle" letter-spacing="3">
    AT WHOLESALE PRICES • PAKISTAN
  </text>

  <!-- Features Badges -->
  <text x="600" y="510" font-family="'Inter', sans-serif, Arial" font-size="16" fill="#9e9e9e" text-anchor="middle" letter-spacing="2">
    BRIDAL SETS  •  NECKLACES  •  EARRINGS  •  RINGS  •  NATIONWIDE DELIVERY
  </text>
</svg>
